name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint · Typecheck · Unit · Build · Links
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm run test:unit
      - run: npm run build
        env:
          SITE: ${{ vars.SITE || 'https://avivg7.github.io' }}
          BASE: ${{ vars.BASE || '/self-beauty' }}
          # Verification build only (never deployed): a mock backend so Playwright can intercept every request.
          PUBLIC_SUPABASE_URL: https://supabase.mock.invalid
          PUBLIC_SUPABASE_ANON_KEY: mock-anon-key
      - run: npm run links
      - uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist
          retention-days: 3

  e2e:
    name: Playwright · a11y · responsive
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: verify
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist
      - run: npx playwright install --with-deps chromium
      - run: npm run build:demo
        env:
          BASE: ${{ vars.BASE || '/self-beauty' }}
      - run: npx playwright test
        env:
          CI: 'true'
          BASE: ${{ vars.BASE || '/self-beauty' }}
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
